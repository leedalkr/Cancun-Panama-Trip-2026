<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Istmo &amp; Arrecife — Panama · Cancún Trip Control</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#122b28;
  --paper:#eef3ef;
  --card:#ffffff;
  --line:#d8e2dc;
  --muted:#5c7069;
  --jungle:#3f7d5c;
  --jungle-dk:#2b5b42;
  --gold:#c98a2c;
  --turquoise:#1c9c92;
  --coral:#e0654a;
  --sand:#f4ede0;
  --danger:#c94b3f;
  --shadow: 0 1px 2px rgba(18,43,40,.06), 0 6px 20px rgba(18,43,40,.06);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:'Inter',system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
}
.mono{font-family:'IBM Plex Mono',monospace;}
h1,h2,h3,.display{font-family:'Fraunces',serif;}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;}
::selection{background:var(--gold);color:#fff;}

/* ---------- App shell ---------- */
#app{max-width:1180px;margin:0 auto;padding:18px 16px 60px;}

.header{
  background:linear-gradient(135deg,var(--jungle-dk) 0%, var(--jungle) 55%, var(--turquoise) 100%);
  border-radius:18px;
  color:#fff;
  padding:26px 28px 20px;
  position:relative;
  overflow:hidden;
  box-shadow:var(--shadow);
}
.header::after{
  content:"";
  position:absolute; left:0; right:0; bottom:0; height:10px;
  background-image: radial-gradient(circle, rgba(255,255,255,.55) 2px, transparent 2.4px);
  background-size: 16px 10px;
  background-position: 8px 2px;
  opacity:.5;
}
.header .eyebrow{
  font-family:'IBM Plex Mono',monospace;
  font-size:11.5px;
  letter-spacing:.14em;
  text-transform:uppercase;
  opacity:.85;
  display:flex; align-items:center; gap:10px;
}
.routeline{display:flex;align-items:center;gap:6px;flex:1;max-width:220px;}
.routeline .dot{width:6px;height:6px;border-radius:50%;background:#fff;flex:none;}
.routeline .dash{flex:1;height:1px;background-repeat:repeat-x;background-image:linear-gradient(90deg,#fff 0 6px, transparent 6px 11px);opacity:.7;}
.header h1{margin:8px 0 4px;font-size:32px;font-weight:600;letter-spacing:-.01em;}
.header .sub{opacity:.92;font-size:14.5px;max-width:640px;line-height:1.5;}
.header .datespan{
  margin-top:14px;display:inline-flex;gap:10px;align-items:center;
  background:rgba(255,255,255,.14);
  border:1px solid rgba(255,255,255,.35);
  padding:7px 14px;border-radius:999px;
  font-family:'IBM Plex Mono',monospace;font-size:12.5px;
}

/* ---------- Tabs ---------- */
.tabbar{display:flex;gap:8px;margin:22px 0 18px;flex-wrap:wrap;}
.tabbar button{
  background:var(--card);border:1px solid var(--line);color:var(--muted);
  padding:10px 16px;border-radius:11px;font-weight:600;font-size:14px;
  display:flex;align-items:center;gap:8px;transition:.15s;
}
.tabbar button .ic{font-size:15px;}
.tabbar button.active{background:var(--jungle-dk);border-color:var(--jungle-dk);color:#fff;}
.tabbar button:hover:not(.active){border-color:var(--jungle);color:var(--jungle-dk);}

.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:var(--shadow);}
.panel + .panel{margin-top:16px;}
.panel h2{margin:0 0 4px;font-size:20px;}
.panel .hint{color:var(--muted);font-size:13px;margin:0 0 16px;line-height:1.5;}

/* ---------- Day tabs (boarding pass) ---------- */
.daystrip{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 14px;margin-bottom:6px;}
.daystub{
  flex:none;position:relative;
  min-width:96px;
  background:var(--sand);
  border:1px dashed #c9b98f;
  border-radius:10px;
  padding:9px 12px 10px;
  cursor:pointer;
  text-align:left;
}
.daystub::after{
  content:"";position:absolute;top:50%;right:-6px;transform:translateY(-50%);
  width:12px;height:12px;background:var(--paper);border-radius:50%;border:1px dashed #c9b98f;
}
.daystub .dow{font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);}
.daystub .dnum{font-family:'Fraunces',serif;font-size:20px;font-weight:600;line-height:1.1;margin:1px 0 3px;}
.daystub .city{font-size:10.5px;font-weight:600;padding:2px 6px;border-radius:999px;display:inline-block;}
.daystub.active{background:var(--jungle-dk);border-color:var(--jungle-dk);}
.daystub.active .dow,.daystub.active .dnum{color:#fff;}
.city.city-panama{background:#e3efe6;color:var(--jungle-dk);}
.city.city-cancun{background:#e1f5f2;color:var(--turquoise);}
.city.city-other{background:#eee;color:#666;}
.daystub.active .city{background:rgba(255,255,255,.85);}

.daymeta{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px;}
.daymeta select, .daymeta input[type=text]{
  border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-size:13px;background:#fff;
}
.smallbtn{
  background:var(--jungle);color:#fff;border:none;border-radius:8px;padding:7px 13px;font-size:13px;font-weight:600;
}
.smallbtn.secondary{background:#fff;color:var(--jungle-dk);border:1px solid var(--jungle);}
.smallbtn.ghost{background:transparent;color:var(--muted);border:1px solid var(--line);}
.smallbtn.danger{background:#fff;color:var(--danger);border:1px solid var(--danger);}

/* ---------- Calendar grid ---------- */
.calwrap{display:flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;}
.gutter{width:58px;flex:none;background:#f7f9f7;border-right:1px solid var(--line);}
.gridscroll{flex:1;overflow-y:auto;max-height:620px;position:relative;}
.rowline{
  height:26px;border-bottom:1px solid #eef1ee;position:relative;
}
.rowline.hour{border-bottom:1px solid #e2e8e3;}
.gutter .rowline{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--muted);padding-right:8px;text-align:right;}
.gutter .rowline span{display:block;transform:translateY(-6px);}
.gridcol{position:relative;}
.slotclick{position:absolute;left:0;right:0;height:26px;}
.slotclick:hover{background:rgba(63,125,92,.07);}
.block{
  position:absolute;left:6px;right:6px;border-radius:8px;
  padding:5px 9px;color:#fff;font-size:12.5px;line-height:1.35;overflow:hidden;
  box-shadow:0 2px 6px rgba(0,0,0,.14);border:1px solid rgba(0,0,0,.08);
}
.block b{display:block;font-size:12.5px;font-weight:700;}
.block .meta{font-family:'IBM Plex Mono',monospace;font-size:10.5px;opacity:.92;}
.block .loc{font-size:10.5px;opacity:.92;}

.legend{display:flex;gap:12px;flex-wrap:wrap;margin-top:12px;}
.legend .item{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);}
.legend .sw{width:11px;height:11px;border-radius:3px;}

/* ---------- Activities pool ---------- */
.poolgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px;}
.actcard{border:1px solid var(--line);border-radius:12px;padding:13px 14px;background:#fbfcfa;}
.actcard .top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
.actcard h4{margin:0;font-size:14.5px;font-family:'Fraunces',serif;font-weight:600;}
.actcard .tag{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;padding:3px 7px;border-radius:999px;color:#fff;white-space:nowrap;}
.actcard .row{font-size:12.5px;color:var(--muted);margin-top:6px;display:flex;gap:6px;align-items:center;}
.actcard .btnrow{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap;}
.badge{background:var(--sand);color:#8a6a1f;font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:999px;}

/* ---------- Map tab ---------- */
.maprow{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
@media (max-width:820px){.maprow{grid-template-columns:1fr;}}
.mapembed{width:100%;height:280px;border:0;border-radius:10px;border:1px solid var(--line);}
.fieldrow{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px;}
.fieldrow label{font-size:11.5px;color:var(--muted);display:block;margin-bottom:3px;font-weight:600;}
.field{display:flex;flex-direction:column;flex:1;min-width:140px;}
.field input,.field select,.field textarea{border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:13.5px;width:100%;}

table{width:100%;border-collapse:collapse;font-size:13.5px;}
table th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);padding:8px 8px;border-bottom:2px solid var(--line);}
table td{padding:8px 8px;border-bottom:1px solid #eef1ee;vertical-align:middle;}
table tr:last-child td{border-bottom:none;}
.tbl-input{border:1px solid var(--line);border-radius:6px;padding:5px 7px;font-size:13px;width:100%;}
.right{text-align:right;}

/* ---------- Budget ---------- */
.summarycards{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:18px;}
.sumcard{border-radius:12px;padding:14px 16px;color:#fff;}
.sumcard .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.06em;opacity:.85;font-family:'IBM Plex Mono',monospace;}
.sumcard .val{font-family:'Fraunces',serif;font-size:24px;font-weight:600;margin-top:4px;}
.sc-planned{background:var(--jungle-dk);}
.sc-estimate{background:var(--turquoise);}
.sc-actual{background:var(--gold);}
.sc-remaining{background:#345;}
.sc-remaining.over{background:var(--danger);}

/* ---------- Modal ---------- */
.overlay{position:fixed;inset:0;background:rgba(18,43,40,.45);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px;}
.modal{background:#fff;border-radius:16px;padding:22px 24px;max-width:460px;width:100%;max-height:88vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.3);}
.modal h3{margin:0 0 14px;font-size:19px;}
.modal .actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;flex-wrap:wrap;}
.modal .actions .spacer{flex:1;}

.emptynote{color:var(--muted);font-size:13.5px;padding:20px;text-align:center;border:1px dashed var(--line);border-radius:10px;}
.savebar{position:fixed;bottom:14px;right:16px;background:var(--ink);color:#fff;padding:8px 14px;border-radius:999px;font-size:12px;font-family:'IBM Plex Mono',monospace;opacity:0;transition:opacity .3s;pointer-events:none;z-index:200;}
.savebar.show{opacity:.92;}
.topbtns{display:flex;justify-content:flex-end;gap:8px;margin-bottom:10px;flex-wrap:wrap;}

a.maplink{color:var(--jungle-dk);font-weight:600;text-decoration:none;font-size:12.5px;border-bottom:1px dashed var(--jungle);}
.footer-note{color:var(--muted);font-size:11.5px;text-align:center;margin-top:26px;line-height:1.6;}
</style>
</head>
<body>
<div id="app"><div class="emptynote">Loading trip data…</div></div>
<div class="savebar mono" id="savebar">saved</div>

<script>
/* =========================================================================
   ISTMO & ARRECIFE — Panama / Cancún Trip Control
   Single-file trip planner: calendar, activities pool, maps & transport,
   budget (preplanning + live tracking). Persisted via window.storage.
   ========================================================================= */

const STORAGE_KEY = "istmo-arrecife-trip-v1";
const TRIP_START = "2026-09-18";
const TRIP_LEN = 10; // Sep 18 -> Sep 27 inclusive

const CATEGORIES = [
  {id:"tour",      label:"Tour",          color:"#2f8f7f"},
  {id:"activity",  label:"Activity",      color:"#3f7fd1"},
  {id:"food",      label:"Food & Drink",  color:"#d1912f"},
  {id:"transport", label:"Transport",     color:"#8b6fd1"},
  {id:"flight",    label:"Flight",        color:"#c94b3f"},
  {id:"lodging",   label:"Hotel / Rest",  color:"#6b6f76"},
  {id:"free",      label:"Free Time",     color:"#5a9a6f"},
];
const CAT_MAP = Object.fromEntries(CATEGORIES.map(c=>[c.id,c]));
const CURRENCIES = ["USD","MXN","TTD"];

let state = null;
let saveTimer = null;

/* ---------------- date helpers ---------------- */
function addDays(dstr, n){
  const [y,m,d] = dstr.split("-").map(Number);
  const dt = new Date(Date.UTC(y, m-1, d));
  dt.setUTCDate(dt.getUTCDate()+n);
  return dt.toISOString().slice(0,10);
}
function dateLabel(dstr){
  const [y,m,d] = dstr.split("-").map(Number);
  const dt = new Date(Date.UTC(y,m-1,d));
  return dt.toLocaleDateString("en-US",{month:"short",day:"numeric",timeZone:"UTC"});
}
function dowLabel(dstr){
  const [y,m,d] = dstr.split("-").map(Number);
  const dt = new Date(Date.UTC(y,m-1,d));
  return dt.toLocaleDateString("en-US",{weekday:"short",timeZone:"UTC"});
}
function uid(){ return Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4); }

function timeToRow(t){ // "13:30" -> row index (0..47)
  const [h,m] = t.split(":").map(Number);
  return h*2 + (m>=30?1:0);
}
function rowToTime(r){
  const h = Math.floor(r/2), m = (r%2)*30;
  return String(h).padStart(2,"0")+":"+String(m).padStart(2,"0");
}
function addMinutes(t,mins){
  const [h,m]=t.split(":").map(Number);
  let total = h*60+m+mins;
  total = Math.max(0, Math.min(24*60, total));
  const hh = Math.floor(total/60), mm = total%60;
  return String(hh).padStart(2,"0")+":"+String(mm).padStart(2,"0");
}
function minutesOf(t){ const [h,m]=t.split(":").map(Number); return h*60+m; }
function fmtMoney(n){ return "$"+ (Math.round(n*100)/100).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2}); }

function toUSD(amount, currency){
  amount = Number(amount)||0;
  if(currency==="USD") return amount;
  if(currency==="MXN") return amount / (state.settings.rateMXN||17);
  if(currency==="TTD") return amount / (state.settings.rateTTD||6.75);
  return amount;
}

/* ---------------- default state ---------------- */
function defaultState(){
  const days = [];
  for(let i=0;i<TRIP_LEN;i++){
    const date = addDays(TRIP_START,i);
    days.push({
      date,
      city: i<5 ? "Panama City" : "Cancún",
      blocks: []
    });
  }
  return {
    tripTitle: "Panama & Cancún",
    days,
    activities: [
      {id:uid(), name:"Panama Canal — Miraflores Locks Visitor Center", city:"Panama City", category:"tour", location:"Miraflores Locks Visitor Center, Panama", duration:150, cost:20, currency:"USD", notes:"Check ship transit schedule before going."},
      {id:uid(), name:"Casco Viejo walking + rooftop bars", city:"Panama City", category:"activity", location:"Casco Viejo, Panama City, Panama", duration:180, cost:0, currency:"USD", notes:"Start late afternoon for golden hour + rooftop sunset."},
      {id:uid(), name:"Isla Mujeres day trip (ferry)", city:"Cancún", category:"tour", location:"Ultramar Ferry Terminal, Puerto Juarez, Cancún", duration:480, cost:45, currency:"USD", notes:"Ferry from Puerto Juárez, book early."},
      {id:uid(), name:"Chichén Itzá guided tour", city:"Cancún", category:"tour", location:"Chichen Itza, Yucatan, Mexico", duration:600, cost:90, currency:"USD", notes:"Long day — leave hotel very early."}
    ],
    transportLog: [],
    budget: {
      planned: [
        {id:uid(), category:"flight", amount:0},
        {id:uid(), category:"lodging", amount:0},
        {id:uid(), category:"tour", amount:0},
        {id:uid(), category:"activity", amount:0},
        {id:uid(), category:"food", amount:0},
        {id:uid(), category:"transport", amount:0},
        {id:uid(), category:"free", amount:0}
      ],
      actual: []
    },
    settings:{ rateMXN:17.0, rateTTD:6.75 },
    ui:{ activeTab:"calendar", activeDay: TRIP_START }
  };
}

/* ---------------- persistence ---------------- */
async function loadState(){
  try{
    const res = await window.storage.get(STORAGE_KEY, false);
    if(res && res.value){
      const parsed = JSON.parse(res.value);
      state = Object.assign(defaultState(), parsed);
      if(!state.settings) state.settings = {rateMXN:17.0, rateTTD:6.75};
      if(!state.ui) state.ui = {activeTab:"calendar", activeDay:TRIP_START};
      return;
    }
  }catch(e){ /* no saved data yet */ }
  state = defaultState();
}
function scheduleSave(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(doSave, 450);
}
async function doSave(){
  try{
    await window.storage.set(STORAGE_KEY, JSON.stringify(state), false);
    flashSaved();
  }catch(e){ console.error("save failed", e); }
}
function flashSaved(){
  const el = document.getElementById("savebar");
  el.classList.add("show");
  setTimeout(()=>el.classList.remove("show"), 900);
}

/* ---------------- rendering root ---------------- */
function render(){
  const app = document.getElementById("app");
  app.innerHTML = `
    ${renderHeader()}
    ${renderTabbar()}
    <div id="tabcontent"></div>
    <div class="footer-note">Trip data is saved automatically to your device.<br>
    Live distance &amp; duration lookups use Google Maps links (no API key wired up here) — open a route to see current traffic-based timing, then log the numbers in the Transport tab.</div>
  `;
  renderTabContent();
}
function renderHeader(){
  return `
  <div class="header">
    <div class="eyebrow">
      <span>PTY</span>
      <span class="routeline"><span class="dot"></span><span class="dash"></span>✈<span class="dash"></span><span class="dot"></span></span>
      <span>CUN</span>
    </div>
    <h1>${state.tripTitle} — Trip Control</h1>
    <div class="sub">Plan tours &amp; activities, map the logistics between them, and track spend from preplanning through the last day on the ground.</div>
    <div class="datespan">Sep 18 – Sep 27, 2026 · 10 days</div>
  </div>`;
}
function renderTabbar(){
  const tabs = [
    {id:"calendar", label:"Itinerary Calendar", ic:"🗓"},
    {id:"activities", label:"Activities Pool", ic:"📋"},
    {id:"map", label:"Map & Transport", ic:"🧭"},
    {id:"budget", label:"Budget", ic:"💰"}
  ];
  return `<div class="tabbar">
    ${tabs.map(t=>`<button class="${state.ui.activeTab===t.id?'active':''}" onclick="setTab('${t.id}')"><span class="ic">${t.ic}</span>${t.label}</button>`).join("")}
  </div>`;
}
function setTab(id){ state.ui.activeTab = id; scheduleSave(); renderTabContent(); }
function renderTabContent(){
  const el = document.getElementById("tabcontent");
  if(state.ui.activeTab==="calendar") el.innerHTML = renderCalendarTab();
  else if(state.ui.activeTab==="activities") el.innerHTML = renderActivitiesTab();
  else if(state.ui.activeTab==="map") el.innerHTML = renderMapTab();
  else if(state.ui.activeTab==="budget") el.innerHTML = renderBudgetTab();
  afterRenderHooks();
}
function afterRenderHooks(){
  if(state.ui.activeTab==="calendar"){
    const gs = document.getElementById("gridscroll");
    if(gs) gs.scrollTop = timeToRow("06:00")*26 - 20;
  }
}

/* ================= CALENDAR TAB ================= */
function currentDay(){
  return state.days.find(d=>d.date===state.ui.activeDay) || state.days[0];
}
function cityClass(city){
  if(city==="Panama City") return "city-panama";
  if(city==="Cancún") return "city-cancun";
  return "city-other";
}
function renderCalendarTab(){
  const day = currentDay();
  return `
  <div class="panel">
    <h2>Itinerary Calendar</h2>
    <p class="hint">Half-hour precision, Sep 18–27. Click any empty slot to drop in a tour, activity, meal, or transfer. Click an existing block to edit or delete it.</p>
    <div class="daystrip">
      ${state.days.map(d=>`
        <div class="daystub ${d.date===day.date?'active':''}" onclick="selectDay('${d.date}')">
          <div class="dow">${dowLabel(d.date)}</div>
          <div class="dnum">${dateLabel(d.date)}</div>
          <span class="city ${cityClass(d.city)}">${d.city}</span>
        </div>`).join("")}
    </div>
    <div class="daymeta">
      <label style="font-size:12.5px;color:var(--muted);font-weight:600;">City for this day:</label>
      <select onchange="setDayCity('${day.date}', this.value)">
        ${["Panama City","Cancún","Travel Day","Other"].map(c=>`<option ${day.city===c?'selected':''}>${c}</option>`).join("")}
      </select>
      <button class="smallbtn" onclick="openBlockModal('${day.date}', null, '09:00')">+ Add to this day</button>
    </div>
    <div class="calwrap">
      <div class="gutter">
        ${Array.from({length:48}).map((_,r)=> r%2===0 ? `<div class="rowline hour"><span>${rowToTime(r)}</span></div>` : `<div class="rowline"></div>`).join("")}
      </div>
      <div class="gridscroll" id="gridscroll">
        <div class="gridcol" style="height:${48*26}px;">
          ${Array.from({length:48}).map((_,r)=>`<div class="slotclick" style="top:${r*26}px;" onclick="openBlockModal('${day.date}', null, '${rowToTime(r)}')"></div>`).join("")}
          ${day.blocks.map(b=>renderBlock(day.date,b)).join("")}
        </div>
      </div>
    </div>
    <div class="legend">
      ${CATEGORIES.map(c=>`<div class="item"><span class="sw" style="background:${c.color}"></span>${c.label}</div>`).join("")}
    </div>
  </div>`;
}
function renderBlock(date, b){
  const cat = CAT_MAP[b.category] || CATEGORIES[1];
  const top = timeToRow(b.start)*26;
  const h = Math.max(22, (timeToRow(b.end)-timeToRow(b.start))*26 - 3);
  const costStr = b.cost ? `${cat_currency_symbol(b.currency)}${Number(b.cost).toFixed(2)} ${b.currency}` : "";
  return `<div class="block" style="top:${top}px;height:${h}px;background:${cat.color};" onclick="event.stopPropagation();openBlockModal('${date}','${b.id}')">
    <b>${escapeHtml(b.title||cat.label)}</b>
    <div class="meta">${b.start}–${b.end}${costStr? " · "+costStr:""}</div>
    ${b.location? `<div class="loc">📍 ${escapeHtml(b.location)}</div>`:""}
  </div>`;
}
function cat_currency_symbol(c){ return c==="USD"?"$":(c==="MXN"?"MX$":"TT$"); }
function escapeHtml(s){ return (s||"").replace(/[&<>"']/g, m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m])); }

function selectDay(date){ state.ui.activeDay = date; scheduleSave(); renderTabContent(); }
function setDayCity(date, city){
  const day = state.days.find(d=>d.date===date);
  day.city = city; scheduleSave(); renderTabContent();
}

function saveBlock(date, id, editing){
  const day = state.days.find(d=>d.date===date);
  let start = document.getElementById("f_start").value;
  let end = document.getElementById("f_end").value;
  if(minutesOf(end) <= minutesOf(start)) end = addMinutes(start,30);
  const payload = {
    id, title: document.getElementById("f_title").value.trim(),
    category: document.getElementById("f_cat").value,
    start, end,
    location: document.getElementById("f_loc").value.trim(),
    cost: parseFloat(document.getElementById("f_cost").value)||0,
    currency: document.getElementById("f_cur").value,
    notes: document.getElementById("f_notes").value.trim(),
    activityId: null
  };
  if(editing){
    const idx = day.blocks.findIndex(b=>b.id===id);
    payload.activityId = day.blocks[idx].activityId;
    day.blocks[idx] = payload;
  } else {
    day.blocks.push(payload);
  }
  closeModal(); scheduleSave(); renderTabContent();
}
function deleteBlock(date,id){
  const day = state.days.find(d=>d.date===date);
  day.blocks = day.blocks.filter(b=>b.id!==id);
  closeModal(); scheduleSave(); renderTabContent();
}

function saveActivity(id, editing){
  const payload = {
    id, name: document.getElementById("a_name").value.trim()||"Untitled activity",

    category: document.getElementById("a_cat").value,

  };

    state.activities[idx] = payload;
  } else state.activities.push(payload);

function deleteActivity(id){
  state.activities = state.activities.filter(a=>a.id!==id);
  closeModal(); scheduleSave(); renderTabContent();
}
function openScheduleModal(activityId){
  const a = state.activities.find(x=>x.id===activityId);
  const timeOptions = Array.from({length:48}).map((_,r)=>rowToTime(r));

function commitSchedule(activityId){
  const a = state.activities.find(x=>x.id===activityId);
  const date = document.getElementById("s_day").value;
  const start = document.getElementById("s_start").value;
  const end = addMinutes(start, a.duration);
  const day = state.days.find(d=>d.date===date);
  day.blocks.push({id:uid(), title:a.name, category:a.category, start, end, location:a.location, cost:a.cost, currency:a.currency, notes:a.notes, activityId:a.id});

  state.ui.activeTab="calendar"; state.ui.activeDay = date;
  renderTabContent();
}

function allKnownLocations(){
  const set = new Map();
  state.activities.forEach(a=>{ if(a.location) set.set(a.location, a.location); });
  state.days.forEach(d=> d.blocks.forEach(b=>{ if(b.location) set.set(b.location,b.location); }));
  return Array.from(set.values());
}
function renderMapTab(){
  const locs = allKnownLocations();
  return `
  <div class="panel">
    <h2>Location Preview</h2>
    <p class="hint">Look up any address or place name. This uses Google's public map embed — no account needed.</p>
    <div class="fieldrow">
      <div class="field" style="flex:2;"><label>Place or address</label><input id="mp_loc" type="text" list="knownlocs" placeholder="e.g. Casco Viejo, Panama City" value="${escapeHtml(state._lastLoc||"")}"></div>
      <div class="field" style="justify-content:flex-end;"><button class="smallbtn" onclick="previewLocation()">Preview</button></div>
    </div>
    <datalist id="knownlocs">${locs.map(l=>`<option value="${escapeHtml(l)}">`).join("")}</datalist>
    <div id="mp_frame_wrap"></div>
  </div>

  <div class="panel">
    <h2>Route Planner</h2>

    <div class="fieldrow">
      <div class="field"><label>From</label><input id="rt_from" type="text" list="knownlocs" placeholder="Origin"></div>
      <div class="field"><label>To</label><input id="rt_to" type="text" list="knownlocs" placeholder="Destination"></div>
      <div class="field"><label>Mode</label><select id="rt_mode"><option value="driving">Driving</option><option value="walking">Walking</option><option value="transit">Transit</option><option value="bicycling">Bicycling</option></select></div>
    </div>

    <div id="rt_frame_wrap"></div>
  </div>

  <div class="panel">
    <h2>Transport Log</h2>
    <p class="hint">Record each transfer once you know real distance/time/cost (from the Maps link above, a taxi quote, shuttle price, etc). These roll into the Budget tab under Transport.</p>
    <div class="topbtns"><button class="smallbtn" onclick="addTransportRow()">+ Add transfer</button></div>
    ${state.transportLog.length? renderTransportTable() : `<div class="emptynote">No transfers logged yet.</div>`}

function previewLocation(){
  const v = document.getElementById("mp_loc").value.trim();
  state._lastLoc = v;
  const wrap = document.getElementById("mp_frame_wrap");
  if(!v){ wrap.innerHTML=""; return; }
  wrap.innerHTML = `<iframe class="mapembed" loading="lazy" src="https://www.google.com/maps?q=${encodeURIComponent(v)}&output=embed"></iframe>
  <div class="fieldrow" style="margin-top:8px;"><a class="maplink" target="_blank" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(v)}">Open full view in Google Maps ↗</a></div>`;
}
function getDirections(){
  const from = document.getElementById("rt_from").value.trim();
  const to = document.getElementById("rt_to").value.trim();
  const mode = document.getElementById("rt_mode").value;
  if(!from || !to) return;
  const url = `https://www.google.com/maps/dir/?api=1&origin=${encodeURIComponent(from)}&destination=${encodeURIComponent(to)}&travelmode=${mode}`;
  window.open(url, "_blank");
  const wrap = document.getElementById("rt_frame_wrap");
  wrap.innerHTML = `<iframe class="mapembed" loading="lazy" src="https://www.google.com/maps?saddr=${encodeURIComponent(from)}&daddr=${encodeURIComponent(to)}&output=embed"></iframe>
  <p class="hint" style="margin-top:8px;">If the embedded preview above looks blank, use the link that opened in the new tab — it always works.</p>`;
}

function addTransportRow(){
  state.transportLog.push({id:uid(), date:state.days[0].date, from:"", to:"", mode:"driving", distance:"", time:"", cost:0, currency:"USD"});
  scheduleSave(); renderTabContent();
}
function updateTransport(id, field, value){
  const t = state.transportLog.find(x=>x.id===id);
  t[field] = (field==="cost") ? (parseFloat(value)||0) : value;
  scheduleSave();
  if(field!=="cost") renderTabContent();
}
function deleteTransport(id){
  state.transportLog = state.transportLog.filter(t=>t.id!==id);
  scheduleSave(); renderTabContent();
}

/* ================= BUDGET TAB ================= */
function itineraryEstimateByCategory(){
  const totals = {};
  CATEGORIES.forEach(c=> totals[c.id]=0);
  state.days.forEach(d=> d.blocks.forEach(b=>{
    totals[b.category] = (totals[b.category]||0) + toUSD(b.cost, b.currency);
  }));
  state.transportLog.forEach(t=>{
    totals.transport = (totals.transport||0) + toUSD(t.cost, t.currency);
  });
  return totals;
}
function actualByCategory(){
  const totals = {};
  CATEGORIES.forEach(c=> totals[c.id]=0);
  state.budget.actual.forEach(e=>{
    totals[e.category] = (totals[e.category]||0) + toUSD(e.amount, e.currency);
  });
  return totals;
}
function renderBudgetTab(){
  const est = itineraryEstimateByCategory();
  const act = actualByCategory();
  const plannedTotal = state.budget.planned.reduce((s,p)=>s+ (Number(p.amount)||0),0);
  const estTotal = Object.values(est).reduce((s,v)=>s+v,0);
  const actTotal = Object.values(act).reduce((s,v)=>s+v,0);
  const remaining = plannedTotal - actTotal;
  return `
  <div class="panel">
    <h2>Budget</h2>
    <p class="hint">All figures normalized to USD using the exchange rates set below, so Panama (USD) and Cancún (MXN) spend compare directly.</p>
    <div class="summarycards">
      <div class="sumcard sc-planned"><div class="lbl">Planned</div><div class="val">${fmtMoney(plannedTotal)}</div></div>
      <div class="sumcard sc-estimate"><div class="lbl">Itinerary Estimate</div><div class="val">${fmtMoney(estTotal)}</div></div>
      <div class="sumcard sc-actual"><div class="lbl">Actual Spent</div><div class="val">${fmtMoney(actTotal)}</div></div>
      <div class="sumcard sc-remaining ${remaining<0?'over':''}"><div class="lbl">${remaining<0?'Over Budget':'Remaining'}</div><div class="val">${fmtMoney(Math.abs(remaining))}</div></div>
    </div>

    <h3 style="font-size:16px;">Preplanning budget by category</h3>
    <table><thead><tr><th>Category</th><th class="right">Planned (USD)</th><th class="right">Itinerary est. (USD)</th><th class="right">Actual (USD)</th></tr></thead>
    <tbody>
      ${state.budget.planned.map(p=>{
        const cat = CAT_MAP[p.category];
        return `<tr><td><span class="sw" style="display:inline-block;width:9px;height:9px;border-radius:2px;background:${cat.color};margin-right:6px;"></span>${cat.label}</td>
        <td class="right"><input class="tbl-input" style="width:110px;text-align:right;" type="number" step="1" value="${p.amount}" onchange="updatePlanned('${p.id}',this.value)"></td>
        <td class="right">${fmtMoney(est[p.category]||0)}</td>
        <td class="right">${fmtMoney(act[p.category]||0)}</td></tr>`;
      }).join("")}
      <tr style="font-weight:700;"><td>Total</td><td class="right">${fmtMoney(plannedTotal)}</td><td class="right">${fmtMoney(estTotal)}</td><td class="right">${fmtMoney(actTotal)}</td></tr>
    </tbody></table>

    <h3 style="font-size:16px;margin-top:22px;">Exchange rates <span style="font-weight:400;color:var(--muted);font-size:12.5px;">(edit if they've moved)</span></h3>
    <div class="fieldrow">
      <div class="field"><label>1 USD = ? MXN</label><input class="tbl-input" type="number" step="0.01" value="${state.settings.rateMXN}" onchange="updateRate('rateMXN',this.value)"></div>
      <div class="field"><label>1 USD = ? TTD</label><input class="tbl-input" type="number" step="0.01" value="${state.settings.rateTTD}" onchange="updateRate('rateTTD',this.value)"></div>
    </div>
  </div>

  <div class="panel">
    <h2>Live Expense Tracking</h2>
    <p class="hint">Log every real purchase on the trip — hotel incidentals, tours paid on arrival, meals, taxis — to see spend against plan in real time.</p>
    <div class="topbtns"><button class="smallbtn" onclick="addExpenseRow()">+ Add expense</button></div>
    ${state.budget.actual.length? renderExpenseTable() : `<div class="emptynote">No expenses logged yet.</div>`}
  </div>`;
}
function updatePlanned(id, value){
  const p = state.budget.planned.find(x=>x.id===id);
  p.amount = parseFloat(value)||0;
  scheduleSave(); renderTabContent();
}
function updateRate(key, value){
  state.settings[key] = parseFloat(value)|| (key==="rateMXN"?17:6.75);
  scheduleSave(); renderTabContent();
}
function renderExpenseTable(){
  const dateOpts = ["Pre-Trip", ...state.days.map(d=>d.date)];
  return `<table><thead><tr><th>Date</th><th>Category</th><th>Description</th><th class="right">Amount</th><th class="right">USD</th><th></th></tr></thead><tbody>
    ${state.budget.actual.map(e=>`<tr>
      <td><select class="tbl-input" onchange="updateExpense('${e.id}','date',this.value)">
        ${dateOpts.map(d=>`<option value="${d}" ${e.date===d?'selected':''}>${d==="Pre-Trip"?"Pre-Trip":dateLabel(d)}</option>`).join("")}

      <td><select class="tbl-input" onchange="updateExpense('${e.id}','category',this.value)">

      <td><input class="tbl-input" value="${escapeHtml(e.description)}" onchange="updateExpense('${e.id}','description',this.value)"></td>
      <td class="right" style="display:flex;gap:4px;">
        <input class="tbl-input" type="number" step="0.01" style="width:80px" value="${e.amount}" onchange="updateExpense('${e.id}','amount',this.value)">
        <select class="tbl-input" style="width:64px" onchange="updateExpense('${e.id}','currency',this.value)">${CURRENCIES.map(c=>`<option ${e.currency===c?'selected':''}>${c}</option>`).join("")}</select>
      </td>
      <td class="right mono">${fmtMoney(toUSD(e.amount,e.currency))}</td>
      <td><button class="smallbtn danger" onclick="deleteExpense('${e.id}')">✕</button></td>
    </tr>`).join("")}
  </tbody></table>`;
}
function addExpenseRow(){
  state.budget.actual.push({id:uid(), date:"Pre-Trip", category:"activity", description:"", amount:0, currency:"USD"});
  scheduleSave(); renderTabContent();
}
function updateExpense(id, field, value){
  const e = state.budget.actual.find(x=>x.id===id);
  e[field] = (field==="amount") ? (parseFloat(value)||0) : value;
  scheduleSave(); renderTabContent();
}
function deleteExpense(id){
  state.budget.actual = state.budget.actual.filter(e=>e.id!==id);
  scheduleSave(); renderTabContent();
}

/* ================= MODAL ================= */
function openModal(innerHtml){
  let ov = document.getElementById("modaloverlay");
  if(!ov){
    ov = document.createElement("div");
    ov.id = "modaloverlay";
    ov.className = "overlay";
    ov.onclick = (e)=>{ if(e.target===ov) closeModal(); };
    document.body.appendChild(ov);
  }
  ov.innerHTML = `<div class="modal" onclick="event.stopPropagation()">${innerHtml}</div>`;
  ov.style.display = "flex";
  document.addEventListener("keydown", escCloseModal);
}
function escCloseModal(e){ if(e.key==="Escape") closeModal(); }
function closeModal(){
  const ov = document.getElementById("modaloverlay");
  if(ov) ov.remove();
  document.removeEventListener("keydown", escCloseModal);
}

/* ================= INIT ================= */
async function init(){
  await loadState();
  render();
}
init();
</script>
